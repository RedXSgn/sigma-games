<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voidlessfrog - Game Hub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #0a1a0a 0%, #0a3a0a 50%, #051505 100%);
            color: #00ff14;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 2rem;
        }

        h1 {
            font-size: 4rem;
            margin-bottom: 1rem;
            text-shadow: 0 0 20px #00ff14, 0 0 40px rgba(0, 255, 20, 0.5);
            letter-spacing: 2px;
            animation: glow 2s ease-in-out infinite;
        }

        .subtitle {
            font-size: 1.5rem;
            color: #00dd00;
            margin-bottom: 2rem;
            opacity: 0.9;
        }

        .buttons {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 2rem;
        }

        .btn {
            padding: 1rem 2rem;
            background: linear-gradient(135deg, #00ff14 0%, #00dd00 100%);
            color: #0a0a0a;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(0, 255, 20, 0.3);
            letter-spacing: 1px;
            text-decoration: none;
            display: inline-block;
        }

        .btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 0 30px rgba(0, 255, 20, 0.6);
        }

        .btn:active {
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: rgba(0, 255, 20, 0.1);
            color: #00ff14;
            border: 2px solid #00ff14;
            background: transparent;
        }

        .btn-secondary:hover {
            background: rgba(0, 255, 20, 0.2);
        }

        .features {
            background: rgba(0, 30, 0, 0.7);
            border: 2px solid #00aa00;
            border-radius: 12px;
            padding: 2rem;
            margin: 2rem 0;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .features h3 {
            color: #00ff14;
            margin-bottom: 1rem;
            text-shadow: 0 0 10px rgba(0, 255, 20, 0.5);
        }

        .features ul {
            list-style: none;
            text-align: left;
        }

        .features li {
            padding: 0.5rem 0;
            color: #00dd00;
            border-bottom: 1px solid rgba(0, 255, 20, 0.2);
        }

        .features li:last-child {
            border-bottom: none;
        }

        .features li::before {
            content: "▶ ";
            color: #00ff14;
            margin-right: 0.5rem;
        }

        .credit {
            margin-top: 2rem;
            color: #00bb00;
            opacity: 0.7;
            font-size: 0.9rem;
        }

        @keyframes glow {
            0%, 100% {
                text-shadow: 0 0 20px #00ff14, 0 0 40px rgba(0, 255, 20, 0.5);
            }
            50% {
                text-shadow: 0 0 30px #00ff14, 0 0 60px rgba(0, 255, 20, 0.8);
            }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }

            .buttons {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚡ VOIDLESSFROG ⚡</h1>
        <p class="subtitle">~ Infinite Gaming Portal ~</p>

        <div class="buttons">
            <a href="voidlessfrog-hub.html" class="btn">🎮 PLAY GAMES (Hub)</a>
            <a href="voidlessfrog.html" class="btn btn-secondary">▶ SINGLE PLAYER</a>
        </div>

        <div class="features">
            <h3>✨ Features</h3>
            <ul>
                <li>50+ Unblocked Games</li>
                <li>Search & Filter Games</li>
                <li>Download Games Locally</li>
                <li>View Game Source Code</li>
                <li>Fast CDN Loading</li>
                <li>Mobile Friendly</li>
                <li>No Bloat - Pure Games</li>
            </ul>
        </div>

        <p class="credit">Made with ⚡ by hohogames</p>
    </div>
</body>
</html>
